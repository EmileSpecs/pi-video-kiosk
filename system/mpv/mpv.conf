# Locked-down kiosk playback
fullscreen=yes
keep-open=no
idle=yes
force-window=no
osc=no
osd-level=0
osd-bar=no
border=no
cursor-autohide=always
input-default-bindings=no
input-vo-keyboard=no
input-builtin-bindings=no
stop-screensaver=yes
hwdec=auto-safe
vo=gpu
gpu-context=wayland
profile=fast
cache=yes
demuxer-max-bytes=150MiB
demuxer-readahead-secs=60
volume-max=100
ytdl=yes
ytdl-format=bestvideo[height<=?720][vcodec^=avc1][fps<=?30]+bestaudio[acodec^=mp4a]/bestvideo[height<=?720][fps<=?30]+bestaudio/best[height<=?720]/best
script-opts=ytdl_hook-ytdl_path=/opt/pi-kiosk/venv/bin/yt-dlp
ytdl-raw-options=no-playlist=,js-runtimes=deno:/usr/local/bin/deno,remote-components=ejs:github
sub-auto=no
sid=no
msg-level=all=info
