# Locked-down kiosk playback. pikioskd drives this instance over the IPC
# socket and only hands it local files: yt-dlp downloads and merges YouTube
# videos first, so no ytdl options live here.
fullscreen=yes
keep-open=no
idle=yes
force-window=no
osc=no
osd-level=0
osd-bar=no
border=no
cursor-autohide=always
input-default-bindings=no
input-vo-keyboard=no
input-builtin-bindings=no
stop-screensaver=yes

# Video: Wayland GPU output, hardware decode when the driver offers it.
hwdec=auto-safe
vo=gpu
gpu-context=wayland
profile=fast

# Audio: PipeWire, then ALSA, then silence. A kiosk without a speaker
# attached must still show the picture.
ao=pipewire,alsa,null
volume-max=100

cache=yes
demuxer-max-bytes=150MiB
demuxer-readahead-secs=60
sub-auto=no
sid=no
msg-level=all=info
