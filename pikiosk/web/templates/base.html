<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Pi Video Kiosk" }}</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <div class="mx-auto flex max-w-6xl flex-col gap-6 p-4 md:flex-row md:p-8">
    <aside class="md:sticky md:top-8 md:w-52 md:shrink-0 md:self-start">
      <p class="mb-3 text-xs font-semibold uppercase tracking-wide text-slate-500">{{ config.device.name }}</p>
      <nav class="flex gap-1 overflow-x-auto pb-1 md:flex-col md:pb-0" aria-label="Admin pages">
        {% for key, label in nav %}
        <a class="pk-nav-link{% if active == key %} pk-nav-link-active{% endif %}" {% if active == key %}aria-current="page"{% endif %} href="/{{ key }}">{{ label }}</a>
        {% endfor %}
        <form method="post" action="/logout" class="md:mt-4 md:border-t md:border-slate-200 md:pt-4">
          <button class="pk-nav-link w-full text-left text-slate-500" type="submit">Log out</button>
        </form>
      </nav>
    </aside>
    <main class="min-w-0 flex-1">
      {% if notice %}<p class="pk-notice" role="status">{{ notice }}</p>{% endif %}
      {% if error %}<p class="pk-alert" role="alert">{{ error }}</p>{% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
  <script>
    document.addEventListener("submit", (event) => {
      const form = event.target;
      const button = event.submitter;
      const confirmText = (button && button.dataset.confirm) || form.dataset.confirm;
      if (confirmText && !window.confirm(confirmText)) {
        event.preventDefault();
        return;
      }
      if (!button || button.dataset.quiet !== undefined) return;
      button.setAttribute("aria-busy", "true");
      button.classList.add("pk-busy");
      const label = button.textContent.trim();
      button.textContent = label === "Save" || label === "Add" ? "Saving…" : label + "…";
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
