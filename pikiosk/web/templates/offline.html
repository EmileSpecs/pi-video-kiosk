{% extends "base.html" %}
{% block content %}
<form method="post" action="/offline" class="pk-card space-y-4">
  <h1 class="text-2xl font-semibold">Offline cache</h1>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="enabled" {% if config.offline.enabled %}checked{% endif %}> Download approved videos</label>
  <label class="pk-field">Size cap (GB)<input class="pk-input" name="max_size_gb" value="{{ config.offline.max_size_gb }}"></label>
  <label class="pk-field">Download window<input class="pk-input" name="download_window" value="{{ config.offline.download_window or '' }}"></label>
  <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="only_offline" {% if config.offline.only_offline %}checked{% endif %}> Never stream</label>
  <div class="flex gap-2">
    <button class="pk-button" type="submit">Save</button>
    <button class="pk-button-secondary" name="action" value="sync" type="submit">Sync now</button>
  </div>
</form>
{% endblock %}
