{% extends "base.html" %}
{% block content %}
<form method="post" action="/playback" class="pk-card space-y-4">
  <h1 class="text-2xl font-semibold">Playback</h1>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label class="pk-field">Default volume<input class="pk-input" type="number" name="default_volume" value="{{ config.playback.default_volume }}"></label>
  <label class="pk-field">Maximum volume<input class="pk-input" type="number" name="max_volume" value="{{ config.playback.max_volume }}"></label>
  <label class="pk-field">After video
    <select class="pk-input" name="after_video">
      {% for mode in ["loop", "next", "stop", "blank"] %}
      <option value="{{ mode }}" {% if config.playback.after_video == mode %}selected{% endif %}>{{ mode }}</option>
      {% endfor %}
    </select>
  </label>
  <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="allow_unlisted" {% if config.playback.allow_unlisted %}checked{% endif %}> Allow a URL from Home Assistant</label>
  <button class="pk-button" type="submit">Save</button>
</form>
{% endblock %}
