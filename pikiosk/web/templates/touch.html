{% extends "base.html" %}
{% block content %}
<form method="post" action="/touch" class="pk-card space-y-4">
  <h1 class="text-2xl font-semibold">Touch screen</h1>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label class="pk-field">Columns<input class="pk-input" type="number" name="columns" value="{{ config.ui.columns }}"></label>
  <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="show_titles" {% if config.ui.show_titles %}checked{% endif %}> Show titles under thumbnails</label>
  <label class="pk-field">Locked screen
    <select class="pk-input" name="locked_screen">
      {% for value in ["black", "logo", "clock"] %}
      <option value="{{ value }}" {% if config.ui.locked_screen == value %}selected{% endif %}>{{ value }}</option>
      {% endfor %}
    </select>
  </label>
  <button class="pk-button" type="submit">Save</button>
</form>
{% endblock %}
