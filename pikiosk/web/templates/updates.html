{% extends "base.html" %}
{% block content %}
<form method="post" action="/updates" class="pk-card space-y-4">
  <h1 class="text-2xl font-semibold">Updates</h1>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="auto" {% if config.update.auto %}checked{% endif %}> Update when the git branch changes</label>
  <label class="pk-field">Branch<input class="pk-input" name="ref" value="{{ config.update.ref }}"></label>
  <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="only_when_idle" {% if config.update.only_when_idle %}checked{% endif %}> Wait until playback is idle</label>
  <div class="flex gap-2">
    <button class="pk-button" type="submit">Save</button>
    <button class="rounded-lg border border-slate-300 px-4 py-2 text-sm" name="action" value="now" type="submit">Update now</button>
  </div>
</form>
{% endblock %}
