[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pikiosk"
version = "1.0.0"
description = "Locked-down YouTube video kiosk for Raspberry Pi, controlled from Home Assistant."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pi Video Kiosk" }]
dependencies = [
    "aiohttp>=3.9",
    "aiomqtt>=2.0",
    "Jinja2>=3.1",
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML",
]

[project.scripts]
pikioskd = "pikiosk.__main__:main"
pikiosk-ctl = "pikiosk.ctl:main"
pikiosk-orient = "pikiosk.screen.orient:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pikiosk*"]

[tool.setuptools.package-data]
pikiosk = ["py.typed", "web/templates/*.html", "web/templates/admin/*.html", "web/static/*", "web/static/img/*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["pikiosk"]
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "mosquitto: optional integration test against a real broker",
]

[tool.coverage.run]
source = ["pikiosk"]
omit = ["pikiosk/simulate.py", "pikiosk/web/static/*"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
